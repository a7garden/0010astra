name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * *'  # UTC 16:00 = KST 01:00 (astra 업데이트 후)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clone astra data repo (private)
      - name: Clone astra knowledge base
        run: git clone https://x-access-token:${{ secrets.PAT }}@github.com/0010capacity/astra.git /tmp/astra || echo "astra repo not accessible, using local data"

      - name: Install dependencies
        run: npm ci

      - name: Build data
        env:
          ASTRA_PATH: /tmp/astra
        run: npm run build:data

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
